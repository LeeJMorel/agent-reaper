name: release

# Pushing a tag like v0.1.0 publishes a release. Run it by hand to build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every platform pi ships a pinned build for (hosts/pi/release.rs). Archives are named for
  # `uname -s` and `uname -m`, the way install.sh looks for them.
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: agent-reaper-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: agent-reaper-linux-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: agent-reaper-darwin-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: agent-reaper-darwin-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Static on Linux, so one binary runs on every distro.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "TARGET_CC=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar -czf ${{ matrix.asset }}.tar.gz -C target/${{ matrix.target }}/release reaper
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the tag matches Cargo.toml
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - run: sha256sum agent-reaper-*.tar.gz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes agent-reaper-*.tar.gz SHA256SUMS install.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # The README's install, against the release just published.
  install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" | sh
      - run: test "$("$HOME/.local/bin/reaper" --version)" = "reaper ${GITHUB_REF_NAME#v}"
