name: release

# Pushing a tag like v0.1.0 publishes a release. Run it by hand to build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every platform pi ships a pinned build for (hosts/pi/release.rs). Archives are named for
  # `uname -s` and `uname -m`, so the README's one-line install picks the right one.
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: reaper-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: reaper-linux-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: reaper-darwin-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: reaper-darwin-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Static on Linux, so one binary runs on every distro.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "TARGET_CC=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar -czf ${{ matrix.asset }}.tar.gz -C target/${{ matrix.target }}/release reaper
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: the tag matches Cargo.toml
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum reaper-*.tar.gz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes reaper-*.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
